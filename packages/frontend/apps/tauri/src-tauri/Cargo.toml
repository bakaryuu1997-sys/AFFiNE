[package]
default-run = "affine-personal"
description = "AFFiNE (personal, Vietnamese edition) as a desktop app"
edition     = "2021"
name        = "affine-personal"
version     = "0.1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
affine-mcp-bridge = { path = "../mcp-bridge" }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tauri             = { version = "2", features = [] }
